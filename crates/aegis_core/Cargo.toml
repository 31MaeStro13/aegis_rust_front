[package]
name = "aegis_core"
version = "0.1.0"
edition = "2021"
authors = ["Aegis Technologies / Oleg Irshko"]
description = "High-performance calculation engine for Aegis Wealth Terminal"

[lib]
name = "aegis_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
